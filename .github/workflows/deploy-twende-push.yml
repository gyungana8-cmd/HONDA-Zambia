name: Deploy TWENDE Push Notifications

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - supabase/functions/send-twende-push/**
      - supabase/config.toml
      - .github/workflows/deploy-twende-push.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Deploy push notification function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-twende-push --project-ref obgteeruczqlebllrafr --no-verify-jwt --yes
