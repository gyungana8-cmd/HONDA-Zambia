name: Build Twende APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract TWENDE source
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'TWENDE*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TWENDE ZIP not found"
            ls -la
            exit 1
          fi
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source
          chmod -R u+rwX source

      - name: Apply Android GPS permissions and WebView handler
        shell: bash
        run: bash .github/scripts/patch-android-gps.sh

      - name: Inspect Android wrapper sources for GPS support
        shell: bash
        run: |
          set -e
          echo "--- ANDROID MANIFESTS ---"
          find source -name AndroidManifest.xml -print
          while IFS= read -r FILE; do
            echo "--- $FILE ---"
            sed -n '1,240p' "$FILE"
          done < <(find source -name AndroidManifest.xml -print)
          echo "--- ACTIVITY CANDIDATES ---"
          find source -type f | grep -E '/[^/]*Activity\.(java|kt)$' || true
          echo "--- WEBVIEW REFERENCES ---"
          grep -RniE 'WebView|WebChromeClient|onGeolocationPermissionsShowPrompt|requestPermissions|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION' source --include='*.java' --include='*.kt' --include='*.xml' || true
          echo "--- COMPLETE MAIN ACTIVITY ---"
          ACTIVITY="$(find source -type f -name MainActivity.java -print -quit)"
          if [ -n "$ACTIVITY" ]; then cat "$ACTIVITY"; fi

      - name: Sync TWENDE website assets
        shell: bash
        run: |
          set -e
          PROJECT_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          ASSET_DIR="$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$ASSET_DIR"
          for FILE in index.html app.js gps-fares.js styles.css manifest.webmanifest twende-logo.svg; do
            if [ -f "$FILE" ]; then cp -f "$FILE" "$ASSET_DIR/"; fi
          done

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          PROJECT_FILE="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project settings file not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verify GPS permissions in packaged APK
        shell: bash
        run: |
          set -e
          APK_FILE="$(find source -type f -path '*/app/build/outputs/apk/debug/*.apk' -print -quit)"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK_FILE" | tee /tmp/twende-permissions.txt
          grep -q "android.permission.ACCESS_FINE_LOCATION" /tmp/twende-permissions.txt
          grep -q "android.permission.ACCESS_COARSE_LOCATION" /tmp/twende-permissions.txt

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e
          APK_FILE="$(find source -type f -path '*/app/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not produced"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_FILE" dist/TWENDE.apk

      - name: Upload TWENDE APK
        uses: actions/upload-artifact@v4
        with:
          name: TWENDE-Android-APK
          path: dist/TWENDE.apk
          if-no-files-found: error
          retention-days: 30
