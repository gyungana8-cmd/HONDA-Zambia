<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">TWENDE sport touring motorcycle</title>
  <desc id="desc">Detailed black and yellow sport touring motorcycle illustration with a windscreen, full front fairing, side pannier and TWENDE branding.</desc>
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#555"/><stop offset=".35" stop-color="#17191c"/><stop offset=".72" stop-color="#050607"/><stop offset="1" stop-color="#34383c"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ffe66a"/><stop offset=".42" stop-color="#ffcc00"/><stop offset="1" stop-color="#d99d00"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f5f5"/><stop offset=".45" stop-color="#9da3a8"/><stop offset="1" stop-color="#454b50"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9d7e8" stop-opacity=".8"/><stop offset="1" stop-color="#283e50" stop-opacity=".9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <ellipse cx="405" cy="375" rx="300" ry="20" fill="#111" opacity=".13" filter="url(#shadow)"/>
