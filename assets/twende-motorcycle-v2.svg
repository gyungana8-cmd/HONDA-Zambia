    <circle cx="208" cy="319" r="72" fill="none" stroke="#555b60" stroke-width="2" stroke-dasharray="3 10"/>
    <circle cx="626" cy="319" r="83" fill="#17191b"/><circle cx="626" cy="319" r="62" fill="none" stroke="#777e83" stroke-width="5"/>
    <circle cx="626" cy="319" r="48" fill="#25292c" stroke="#aeb4b8" stroke-width="3"/>
